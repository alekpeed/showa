[package]
name = "showa-video-cabinet"
version = "0.1.0"
description = "A private Showa-era entertainment cabinet"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "showa_video_cabinet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-http = "2"

# Updater and process restart are desktop-only. Guarding them keeps the crate
# buildable if this is ever pointed at another target.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
